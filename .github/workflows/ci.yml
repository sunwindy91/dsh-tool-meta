name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 零依赖单测：治理承诺（负向清单/阈值去重/账本/审计/归档不删）在干净环境也必须过
      - name: 单元测试（零依赖）
        run: node tests/unit.mjs

      - name: 语法检查（全部 JS 模块）
        run: |
          for f in lib/*.js verify_plugin.mjs tools/observe.mjs tests/unit.mjs; do
            node --check "$f"
          done

      - name: 观测脚本可运行（写入临时目录，不污染仓库）
        run: META_SKILLS_DIR="$(mktemp -d)" node tools/observe.mjs

# 说明：verify_plugin.mjs（全链路）需要能解析 peerDependency @deepseek-ai/dsh-tools，
# 它在 DSH profile 内可用；干净 CI 环境无法提供，因此这里不跑，属预期（见 README 第二节）。
